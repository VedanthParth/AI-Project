[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathtrace"
version = "0.1.0"
description = "Pointer-network learning path recommendation with auxiliary knowledge tracing (Junyi Academy)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "torch>=2.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
pathtrace = "pathtrace.cli:main"

[tool.setuptools.packages.find]
include = ["pathtrace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
