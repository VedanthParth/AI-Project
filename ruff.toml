# Lint and format settings for ml/ and backend/: `ruff check ml backend` and `ruff format ml backend`.
line-length = 120
target-version = "py310"
extend-exclude = ["*.ipynb"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# zip() over arrays that are the same length by construction; strict= would only add noise.
ignore = ["B905"]

[lint.isort]
known-first-party = ["pathtrace"]
